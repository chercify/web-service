<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Formulaire de contact</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        form {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #357abd;
        }
    </style>
</head>

<body>

    <form id="contactForm">
        <h2>Contactez-nous</h2>

        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Envoyer</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBejV8kVa9hTgsrZ0O40AwFVLOrhiqULPs",
            authDomain: "payment-form-5a2f7.firebaseapp.com",
            projectId: "payment-form-5a2f7",
            storageBucket: "payment-form-5a2f7.firebasestorage.app",
            messagingSenderId: "940273318260",
            appId: "1:940273318260:web:37ca53a1bca813db0c1421",
            measurementId: "G-739RX5QRDW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbz_l-g5ZstBwEuxHHQLQl3h09H_gRYKeEJni3d-ymGguFCNR1hRJv80lopgF6P6QYTN/exec";

        const form = document.getElementById("contactForm");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = {
                nom: form.nom.value,
                email: form.email.value,
                message: form.message.value
            };

            try {
                // 1. Envoi vers Firebase Firestore
                await addDoc(collection(db, "messages"), {
                    ...formData,
                    date: new Date()
                });

                // 2. Envoi vers Google Sheets
                await fetch(GOOGLE_SHEETS_URL, {
                    method: "POST",
                    body: JSON.stringify(formData),
                    headers: { "Content-Type": "text/plain" }
                });

                alert("Formulaire envoyé avec succès !");
                form.reset();
            } catch (error) {
                console.error("Erreur :", error);
                alert("Erreur lors de l'envoi");
            }
        });
    </script>

</body>

</html>
